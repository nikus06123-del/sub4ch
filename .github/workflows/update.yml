name: Update VPN subscription

on:
  schedule:
    # каждые 2 часа (UTC). GitHub может сдвигать запуск на 5-20 минут.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Максимум конфигов на проверку за прогон (0 = без лимита)"
        required: false
        default: "0"
  push:
    # первый прогон срабатывает сразу после деплоя программы.
    # Коммиты от встроенного GITHUB_TOKEN сами не запускают новые прогоны,
    # так что зацикливания не будет.
    branches: [main]
    paths-ignore:
      - sub.txt
      - sub_plain.txt
      - stats.json
      - README.md

permissions:
  contents: write

concurrency:
  group: sub4ch-update
  cancel-in-progress: false

jobs:
  check-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check configs and publish subscription
        env:
          # Встроенный токен Actions: запись в репозиторий разрешена
          # блоком permissions выше. Никаких персональных токенов не нужно.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Лимит конфигов на прогон: поле при ручном запуске, иначе 80000
          # (защита от таймаута job'а на очень больших пулах)
          CHECKER_MAX_RUN: ${{ github.event.inputs.limit || '80000' }}
        run: |
          python checker.py \
            --tcp-concurrency 1500 \
            --core-concurrency 150

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Результат цикла Sub4ch Checker"
            if [ -f out/report.txt ]; then
              echo '```'
              tail -n 1 out/report.txt
              echo '```'
            else
              echo "Отчёт не создан — цикл прервался до записи report.txt. Смотрите логи выше."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
